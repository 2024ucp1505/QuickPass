<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <rect width="1000" height="600" fill="#dae1ed"/>
  <rect x="50" y="50" width="900" height="500" fill="#ffffff" rx="8" style="box-shadow: 0 4px 6px rgba(0,0,0,0.1);"/>
  
  <!-- Sidebar -->
  <path d="M 50 58 Q 50 50 58 50 L 250 50 L 250 550 L 58 550 Q 50 550 50 542 Z" fill="#0d0f12"/>
  <text x="70" y="90" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">QuickPass Admin</text>
  <rect x="70" y="130" width="160" height="40" fill="#0056d2" rx="4"/>
  <text x="90" y="155" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Live Session</text>
  <text x="90" y="205" font-family="Arial, sans-serif" font-size="14" fill="#c1cbdb">Classrooms</text>
  <text x="90" y="255" font-family="Arial, sans-serif" font-size="14" fill="#c1cbdb">Analytics</text>
  
  <!-- Main Content -->
  <text x="290" y="100" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0d0f12">Data Structures &amp; Algorithms</text>
  <text x="290" y="125" font-family="Arial, sans-serif" font-size="14" fill="#0d0f12" opacity="0.6">Session ID: #883920 • Active</text>
  
  <!-- QR Box -->
  <rect x="290" y="160" width="220" height="220" fill="#ffffff" stroke="#c1cbdb" stroke-width="2" rx="8"/>
  <rect x="340" y="210" width="120" height="120" fill="#0d0f12" rx="4"/>
  <rect x="290" y="400" width="220" height="30" fill="#dae1ed" rx="15"/>
  <rect x="290" y="400" width="160" height="30" fill="#0056d2" rx="15"/>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">Refreshes in 4s</text>
  
  <!-- Student List -->
  <text x="560" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0d0f12">Live Attendance Log (32/45)</text>
  
  <!-- Normal Log -->
  <rect x="560" y="190" width="350" height="50" fill="#ffffff" stroke="#c1cbdb" stroke-width="1" rx="4"/>
  <circle cx="585" cy="215" r="10" fill="#4caf50"/>
  <text x="610" y="220" font-family="Arial, sans-serif" font-size="14" fill="#0d0f12">Alice Sharma</text>
  <text x="830" y="220" font-family="Arial, sans-serif" font-size="12" fill="#0d0f12" opacity="0.5">09:02:11 AM</text>
  
  <!-- Flagged Proxy Log -->
  <rect x="560" y="250" width="350" height="50" fill="#fff5f5" stroke="#f56565" stroke-width="2" rx="4"/>
  <circle cx="585" cy="275" r="10" fill="#e53e3e"/>
  <text x="610" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e53e3e">Bob Singh</text>
  <rect x="730" y="265" width="100" height="20" fill="#e53e3e" rx="4"/>
  <text x="780" y="279" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">PROXY FLAGGED</text>
  <text x="840" y="280" font-family="Arial, sans-serif" font-size="12" fill="#e53e3e" opacity="0.8">Device Match</text>
  
  <!-- Normal Log 2 -->
  <rect x="560" y="310" width="350" height="50" fill="#ffffff" stroke="#c1cbdb" stroke-width="1" rx="4"/>
  <circle cx="585" cy="335" r="10" fill="#4caf50"/>
  <text x="610" y="340" font-family="Arial, sans-serif" font-size="14" fill="#0d0f12">Charlie Gupta</text>
  <text x="830" y="340" font-family="Arial, sans-serif" font-size="12" fill="#0d0f12" opacity="0.5">09:02:44 AM</text>
  
  <!-- Left Footer Constraint -->
  <text x="20" y="585" font-family="Arial, sans-serif" font-size="14" fill="#0d0f12" font-weight="bold">Lokesh Saini</text>
</svg>
